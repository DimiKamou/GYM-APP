<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PowerHouse">
  <!-- 60 black, 30 orange, 10 purple — the app's own split, at icon size. PH is drawn as
       strokes rather than set in a font, so it renders the same with no typeface loaded. -->
  <defs>
    <radialGradient id="ember" cx="50%" cy="0%" r="95%">
      <stop offset="0" stop-color="#3A1C0A"/>
      <stop offset="0.6" stop-color="#0B0A0C"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#ember)"/>
  <g fill="none" stroke-width="52" stroke-linejoin="round" stroke-linecap="butt">
    <path d="M107 364V148" stroke="#FF7A1A"/>
    <path d="M107 174H191A58 58 0 0 1 191 290H107" stroke="#FF7A1A"/>
    <path d="M319 148V364M405 148V364" stroke="#FF7A1A"/>
    <path d="M345 256H379" stroke="#A78BFA"/>
  </g>
</svg>
